# Baut die Werbeblocker-Listen (WebKit-Regelsätze und Scriptlets) täglich neu und veröffentlicht sie als
# Dateien am GitHub-Release „filterlisten-latest“. Die App lädt höchstens einmal am Tag
#   https://github.com/<Repo>/releases/download/filterlisten-latest/manifest.json
# und bei neuerem Stand die dort genannten Dateien (BrowserFilterListUpdater). Doku: docs/ERWEITERUNGEN.md, 6.10.
#
# Warum ein Release statt eines Branches: Die Dateien (≈ 2,3 MB je Stand) landen nicht in der Git-Historie,
# main bleibt unberührt, und es gibt keinen Force-Push. Dateinamen tragen einen SHA-256-Präfix, das Manifest wird
# zuletzt hochgeladen: Ein Manifest zeigt nie auf fehlende oder andere Dateien. Alte Dateien bleiben einen Stand
# lang liegen (für Geräte, die gerade das vorige Manifest geladen haben).
#
# Warum macOS: tools/validate_adblock_rules.swift kompiliert jeden Regelsatz mit dem echten WebKit (nur auf macOS).
# Eine Liste, die WebKit ablehnt, wird so gar nicht erst veröffentlicht. Für öffentliche Repos kostet das nichts.

name: Filterlisten

on:
  schedule:
    - cron: "17 3 * * *" # täglich 03:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Auch ohne inhaltliche Änderung neu veröffentlichen"
        type: boolean
        default: false

permissions:
  contents: write # Release anlegen und Dateien hochladen
  actions: write  # Zeitplan aktiv halten (letzter Schritt)

concurrency:
  group: filterlisten
  cancel-in-progress: false

env:
  TAG: filterlisten-latest
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # build_scriptlets.py braucht node/npm (installiert @adguard/scriptlets und @adguard/extended-css
      # in tools/vendor-download, ruft tools/scriptlets_convert.mjs auf)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: WebKit-Regelsätze bauen
        run: python3 tools/build_adblock_rules.py --refresh --out-dir out/contentblocker

      - name: Regelsätze mit WebKit prüfen
        run: |
          swiftc -O tools/validate_adblock_rules.swift -o "$RUNNER_TEMP/validate_adblock"
          "$RUNNER_TEMP/validate_adblock" out/contentblocker

      - name: Scriptlets bauen
        # nutzt den Listen-Cache aus dem ersten Schritt (gleicher Stand wie die Regelsätze)
        run: python3 tools/build_scriptlets.py --out-dir out/scriptlets

      - name: Bisher veröffentlichten Stand holen
        run: |
          mkdir -p out/previous
          gh release download "$TAG" --pattern manifest.json --dir out/previous \
            || echo "Noch kein Release $TAG, wird angelegt."

      - name: Dateien und Manifest zusammenstellen
        id: publish
        run: |
          python3 tools/publish_filterlists.py \
            --contentblocker out/contentblocker --scriptlets out/scriptlets \
            --out out/publish --previous out/previous/manifest.json >> "$GITHUB_OUTPUT"
          cat out/publish/manifest.json

      - name: Veröffentlichen
        if: steps.publish.outputs.changed == 'true' || inputs.force
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          Automatisch erzeugte Werbeblocker-Listen für die App (Workflow `.github/workflows/filterlisten.yml`).
          Die App lädt `manifest.json` und die darin genannten Dateien; bitte nicht von Hand bearbeiten.

          Quellen: uBlock Origin Lite (Standardlisten und Malware, gorhill/uBlock bzw. uBlockOrigin/uAssets),
          EasyList, EasyPrivacy, EasyList Germany, Peter Lowe's List, URLhaus. Scriptlets aus @adguard/scriptlets
          (GPL-3.0, siehe LICENSE-GPL-3.0.txt). Lizenzen der Listen: siehe THIRD_PARTY_NOTICES.md im Repo.
          EOF
            gh release create "$TAG" --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Filterlisten (automatisch)" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          # Zuerst die Daten, das Manifest zuletzt: Es zeigt erst dann auf die neuen Dateien, wenn sie da sind.
          gh release upload "$TAG" out/publish/*.json.z out/publish/LICENSE-GPL-3.0.txt --clobber
          gh release upload "$TAG" out/publish/manifest.json --clobber
          # Dateien entfernen, die weder zum neuen noch zum vorigen Stand gehören
          gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r name; do
            if ! grep -qxF "$name" out/publish/keep.txt; then
              echo "entferne $name"
              gh release delete-asset "$TAG" "$name" --yes
            fi
          done
          echo "Veröffentlicht: https://github.com/$GH_REPO/releases/download/$TAG/manifest.json"

      - name: Unverändert
        if: steps.publish.outputs.changed != 'true' && !inputs.force
        run: echo "Inhalt unverändert gegenüber dem veröffentlichten Stand, nichts hochgeladen."

      # GitHub schaltet zeitgesteuerte Workflows in öffentlichen Repos nach 60 Tagen ohne Repo-Aktivität ab.
      # Das erneute Aktivieren über die API setzt diese Frist zurück. Schlägt es fehl, läuft der Workflow trotzdem.
      - name: Zeitplan aktiv halten
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: gh api -X PUT "repos/$GH_REPO/actions/workflows/filterlisten.yml/enable"
